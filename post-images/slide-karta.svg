line x1="150" y1="808.2" x2="240" y2="896" stroke="#24231E" stroke-width="1.4"/><line x1="330" y1="808.2" x2="240" y2="896" stroke="#24231E" stroke-width="1.4"/><line x1="470" y1="826.4" x2="470" y2="896" stroke="#24231E" stroke-width="1.4"/><line x1="780" y1="826.4" x2="850" y2="896" stroke="#24231E" stroke-width="1.4"/><line x1="930" y1="826.4" x2="850" y2="896" stroke="#24231E" stroke-width="1.4"/><text x="72" y="1110" font-family="Onest" font-size="27" font-weight="400" font-style="normal" fill="#24231E" fill-opacity="1" text-anchor="start" letter-spacing="0"><tspan x="72" dy="0">Записала в центр слово «Seasons» и всё, что приходило в голову.</tspan><tspan x="72" dy="37.26">Первые ассоциации банальные — журнал, осень. Интересное началось</tspan><tspan x="72" dy="37.26">дальше: из «бумаги» выросли рваные края, из «подушек» — первый</tspan><tspan x="72" dy="37.26">экран, а из всего вместе — идея <tspan font-weight="600" fill="#C8782A">сайта, который можно потрогать</tspan>.</tspan></text><text x="960" y="1310" font-family="Space Mono" font-size="18" font-weight="400" font-style="normal" fill="#6E6A5E" fill-opacity="1" text-anchor="start" letter-spacing="0"><tspan x="960" dy="0">3/9</tspan></text></svg>