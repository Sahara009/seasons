<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect width="1080" height="1350" fill="#2B3520"/><text x="960" y="80" font-family="Space Mono" font-size="18" font-weight="400" font-style="normal" fill="#FBF7EC" fill-opacity="0.5" text-anchor="start" letter-spacing="0"><tspan x="960" dy="0">2/9</tspan></text><text x="72" y="140" font-family="Onest" font-size="40" font-weight="500" font-style="normal" fill="#FBF7EC" fill-opacity="1" text-anchor="start" letter-spacing="1"><tspan x="72" dy="0">О ПРОЕКТЕ:</tspan></text><text x="72" y="220" font-family="Onest" font-size="26" font-weight="400" font-style="normal" fill="#FBF7EC" fill-opacity="0.92" text-anchor="start" letter-spacing="0"><tspan x="72" dy="0">Seasons of life — независимый журнал о жизни по сезонам. С</tspan><tspan x="72" dy="36.92">2003 года он вырос в целый мир: второй журнал Afternoon,</tspan><tspan x="72" dy="36.92">Школа, фестивали и мастерские. Каждый номер — это бумага,</tspan><tspan x="72" dy="36.92">иллюстрации и истории, которые хочется держать в руках.</tspan><tspan x="72" dy="36.92"> </tspan><tspan x="72" dy="36.92">Мой проект — неофициальный редизайн их сайта. Задача: чтобы</tspan><tspan x="72" dy="36.92">сайт ощущался как <tspan font-weight="600" fill="#EBC394">ещё один номер журнала</tspan>, а не как каталог.</tspan></text><text x="72" y="690" font-family="Onest" font-size="40" font-weight="500" font-style="normal" fill="#FBF7EC" fill-opacity="1" text-anchor="start" letter-spacing="1"><tspan x="72" dy="0">КОНЦЕПЦИЯ:</tspan></text><text x="72" y="745" font-family="Onest" font-size="24" font-weight="400" font-style="normal" fill="#FBF7EC" fill-opacity="0.75" text-anchor="start" letter-spacing="0"><tspan x="72" dy="0">Ключевая идея [ сайт, который можно потрогать ]</tspan></text><text x="72" y="820" font-family="Onest" font-size="26" font-weight="400" font-style="normal" fill="#FBF7EC" fill-opacity="0.92" text-anchor="start" letter-spacing="0"><tspan x="72" dy="0">Журнал — вещь тактильная: его листают, складывают в стопки,</tspan><tspan x="72" dy="36.92">носят в сумке. Я хотела <tspan font-weight="600" fill="#EBC394">перенести это ощущение на экран</tspan>.</tspan><tspan x="72" dy="36.92"> </tspan><tspan x="72" dy="36.92">Журнал на первом экране выходит из рук героини и листается</tspan><tspan x="72" dy="36.92">нажатием, обложки выглядывают из кармашков, а каждый клик</tspan><tspan x="72" dy="36.92">щёлкает, как затвор фотоаппарата. Рваные края, бумажные</tspan><tspan x="72" dy="36.92">вырезки и цвета с обложек держат всё вместе.</tspan><tspan x="72" dy="36.92"> </tspan><tspan x="72" dy="36.92">Сайт не продаёт журнал в лоб, а приглашает устроиться</tspan><tspan x="72" dy="36.92">поудобнее и почитать.</tspan></text><text x="72" y="1300" font-family="Onest" font-size="18" font-weight="400" font-style="normal" fill="#FBF7EC" fill-opacity="0.5" text-anchor="start" letter-spacing="0"><tspan x="72" dy="0">@gatito-code</tspan></text></svg>